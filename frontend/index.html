<link rel="stylesheet" href="/frontend/style.css">

<div class="container">

    <header>
        <h1>📝 Blog Dashboard</h1>
        <a href="/create" class="btn">+ Create Blog</a>
    </header>

    <div class="search-box">
        <input type="text" placeholder="Search blogs...">
    </div>

    <div class="blog-grid">

        {% for blog in blogs %}
        <div class="blog-card">
            <h2>{{ blog.title }}</h2>

            <p class="author">
                By {{ blog.author }}
            </p>

            <p class="content">
                {{ blog.content[:120] }}...
            </p>

            <div class="actions">
                <a href="/blog/{{ blog.id }}" class="view">View</a>
                <a href="/edit/{{ blog.id }}" class="edit">Edit</a>
                <a href="/delete/{{ blog.id }}" class="delete">Delete</a>
            </div>
        </div>
        {% endfor %}

    </div>

</div>
